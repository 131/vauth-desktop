<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#467461"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#24342f}.title{font-size:22px;font-weight:700}.head{font-size:17px;font-weight:600}.body{font-size:13px}.box{fill:#fff;stroke:#c7d8cd;stroke-width:2}.link{fill:none;stroke:#467461;stroke-width:2;marker-end:url(#arrow)}.label{font-size:12px;fill:#467461}</style>
<rect width="1000" height="520" rx="14" fill="#f7f9f6"/>
<text x="30" y="42" class="title">vauth-desktop</text><text x="30" y="66" class="body">Embedded workspace, Go Vault client and two sign-in modes</text>
<rect class="box" x="30" y="120" width="210" height="100" rx="10"/><text class="head" x="48" y="150">SSH agent / Pageant</text><text class="body" x="48" y="177">Public keys and signatures</text><text class="body" x="48" y="199">Normal encrypted CLI cache</text>
<rect class="box" x="315" y="100" width="300" height="220" rx="10"/><text class="head" x="334" y="131">Desktop + Go</text><text class="body" x="334" y="162">Vauth Secured Environnement (venv)</text><text class="body" x="334" y="187">SSH Keys</text><text class="body" x="334" y="212">Secrets browser</text><text class="body" x="334" y="248">Vault requests outside the UI thread</text><text class="body" x="334" y="272">SSO token and drafts: memory only</text><text class="body" x="334" y="296">No remote content in WebView2</text>
<rect class="box" x="700" y="100" width="265" height="155" rx="10"/><text class="head" x="718" y="132">Vault</text><text class="body" x="718" y="162">Identity and own SSH role</text><text class="body" x="718" y="187">Accessible KV v1 / KV v2 mounts</text><text class="body" x="718" y="212">ACLs and KV v2 compare-and-set</text><text class="body" x="718" y="236">OIDC challenge and code exchange</text>
<rect class="box" x="30" y="365" width="230" height="108" rx="10"/><text class="head" x="48" y="395">System browser</text><text class="body" x="48" y="422">Login with SSO</text><text class="body" x="48" y="446">Callback stays on localhost</text>
<rect class="box" x="700" y="355" width="265" height="108" rx="10"/><text class="head" x="718" y="386">Entra OIDC</text><text class="body" x="718" y="414">Interactive provider sign-in</text><text class="body" x="718" y="441">Client secret remains with Vault</text>
<path class="link" d="M240 165H315"/><text class="label" x="247" y="153">SSH login</text>
<path class="link" d="M615 175H700"/><text class="label" x="627" y="162">Vault API</text>
<path class="link" d="M832 255V355"/><text class="label" x="843" y="304">OIDC</text>
<path class="link" d="M260 409H700"/><text class="label" x="370" y="399">Provider sign-in in system browser</text>
<path class="link" d="M145 365V286H315"/><text class="label" x="34" y="272">localhost:8250 callback</text>
<text class="body" x="315" y="490">Updates: GitHub manifest, signed executable and checksum verification</text>
</svg>
